spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=80000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.max-lifetime=1500000

# JWT
jwt.secret=${SECRET_KEY_JWT}
jwt.expiration=${EXPIRATION_TIME_JWT}


# OpenApi
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Cookies
cookie.domain=.especlubsmatch.app
cookie.sameSite=None
cookie.secure=true

smtp.alert.host=${ALERT_SMTP_HOST}
smtp.alert.from=${ALERT_SMTP_FROM}
smtp.alert.user=${ALERT_SMTP_USER}
smtp.alert.password=${ALERT_SMTP_PASSWORD}
smtp.alert.to=${ALERT_SMTP_TO}
smtp.alert.port=${ALERT_SMTP_PORT}


spring.ai.google.genai.api-key=${API_GEMINI_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite

# Desactiva la página de error por defecto de Spring Boot (Whitelabel Error Page).
server.error.whitelabel.enabled=false
# Evita que los mensajes de error detallados se muestren en la respuesta HTTP.
server.error.include-message=never
# Evita que las trazas de pila se incluyan en la respuesta HTTP en caso de error.
server.error.include-stacktrace=never
# Oculta la cabecera del servidor para mejorar la seguridad.
server.server-header=
